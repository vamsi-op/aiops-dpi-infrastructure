# =============================================================================
# The Python AIOps services (modules 3-9).
#
# Always combined with the base stack and the observability layer, because these services
# read Prometheus and write TimescaleDB and Redis:
#   .\scripts\stack.ps1 up -Layer all
#
# Only the metrics agent exists so far. The rest are added as their modules land, which is
# why prometheus.yml already lists all seven as scrape targets - Prometheus reporting the
# absent ones as down is correct and useful information, not noise.
# =============================================================================

name: aiops-dpi

networks:
  aiops:
    name: aiops-net
    driver: bridge

# ---------------------------------------------------------------------------
# Every AIOps service shares the same environment and build shape. Anchored so a change
# to the shared parts cannot reach one service and silently miss the others.
# ---------------------------------------------------------------------------
x-aiops-common: &aiops-common
  restart: unless-stopped
  networks: [aiops]
  environment: &aiops-env
    AIOPS_ENV: ${AIOPS_ENV:-local}
    AIOPS_LOG_LEVEL: ${AIOPS_LOG_LEVEL:-INFO}
    # JSON regardless of the host setting, so Alloy can parse these into Loki labels.
    AIOPS_LOG_FORMAT: json
    AIOPS_DPI_PLATFORM: ${AIOPS_DPI_PLATFORM:-mojaloop}

    # Container-to-container addresses. The values in .env are localhost because that file
    # is read by code running on the host; inside the network these have to be Docker DNS
    # names, and localhost would resolve to the container itself.
    POSTGRES_HOST: timescaledb
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-aiops}
    POSTGRES_USER: ${POSTGRES_USER:-aiops}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_local_dev_password}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: ${REDIS_DB:-0}
    PROMETHEUS_URL: http://prometheus:9090
    LOKI_URL: http://loki:3100
    TEMPO_URL: http://tempo:3200
    ALERTMANAGER_URL: http://alertmanager:9093
    OTLP_ENDPOINT: http://tempo:4318
    TRACING_ENABLED: ${TRACING_ENABLED:-true}
    TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1.0}

services:
  # ---------------------------------------------------------------------------
  # Module 3 - metrics collection agent.
  #
  # Reads the dpi:* recording rules from Prometheus every SCRAPE_INTERVAL_SECONDS,
  # normalises them into service_metrics rows, and publishes each sample to
  # aiops.metrics for the anomaly detector.
  # ---------------------------------------------------------------------------
  metrics-agent:
    <<: *aiops-common
    build:
      # Context is the repo root, not services/metrics_agent, because the image needs libs/.
      context: .
      dockerfile: services/metrics_agent/Dockerfile
    image: aiops/metrics-agent:0.1.0
    container_name: aiops-metrics-agent
    environment:
      <<: *aiops-env
      AIOPS_SERVICE_NAME: metrics-agent
      # Matches prometheus.yml's scrape_interval. Collecting faster than Prometheus scrapes
      # would write the same values repeatedly under new timestamps, inventing resolution
      # the data does not have.
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-15}
    ports:
      - "${METRICS_AGENT_PORT:-8020}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: Prometheus is a readiness dependency the agent reports on
      # itself, and blocking start-up on it would make a Prometheus restart look like an
      # agent crash loop.
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Module 4 - anomaly detector.
  #
  # Consumes aiops.metrics, scores each sample against a per-service Isolation Forest
  # with hour-of-day-aware baselines, and publishes aiops.anomalies with feature
  # attribution and a kind that maps to a remediation playbook.
  # ---------------------------------------------------------------------------
  anomaly-detector:
    <<: *aiops-common
    build:
      context: .
      dockerfile: services/anomaly_detector/Dockerfile
    image: aiops/anomaly-detector:0.1.0
    container_name: aiops-anomaly-detector
    environment:
      <<: *aiops-env
      AIOPS_SERVICE_NAME: anomaly-detector
      MODEL_ARTIFACT_DIR: /app/ml/artifacts
      ANOMALY_CONTAMINATION: ${ANOMALY_CONTAMINATION:-0.02}
      ANOMALY_MIN_TRAINING_ROWS: ${ANOMALY_MIN_TRAINING_ROWS:-2000}
      ANOMALY_SCORE_THRESHOLD: ${ANOMALY_SCORE_THRESHOLD:-0.65}
    ports:
      - "${ANOMALY_DETECTOR_PORT:-8021}:8000"
    volumes:
      # Bind-mounted rather than a named volume so a trained model can be inspected, copied
      # or deleted from the host without exec'ing into the container. Models are build
      # artifacts of a training run, not opaque container state.
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not a hard dependency: the detector reads the metrics *stream*, not Prometheus. But
      # with no agent there is nothing on the stream, so starting after it avoids a confusing
      # "running but scoring nothing" first minute.
      metrics-agent:
        condition: service_started
    deploy:
      resources:
        limits:
          # Fitting five Isolation Forests is the heaviest thing any AIOps service does, and
          # it is bursty - seconds of work on a POST /train, then idle. Scoring needs almost
          # nothing.
          cpus: "1.00"
          memory: 768M

  # ---------------------------------------------------------------------------
  # Module 5 - traffic predictor.
  #
  # Forecasts each service on 1, 6 and 24 hour horizons from the 1-hour rollup, backtests
  # against a seasonal-naive baseline, and turns the predicted peak into a replica
  # recommendation on aiops.predictions.
  # ---------------------------------------------------------------------------
  traffic-predictor:
    <<: *aiops-common
    build:
      context: .
      dockerfile: services/traffic_predictor/Dockerfile
    image: aiops/traffic-predictor:0.1.0
    container_name: aiops-traffic-predictor
    environment:
      <<: *aiops-env
      AIOPS_SERVICE_NAME: traffic-predictor
      FORECAST_HORIZONS: ${FORECAST_HORIZONS:-1,6,24}
      FORECAST_HISTORY_DAYS: ${FORECAST_HISTORY_DAYS:-28}
      FORECAST_INTERVAL_SECONDS: ${FORECAST_INTERVAL_SECONDS:-600}
      SCALING_MIN_HEADROOM: ${SCALING_MIN_HEADROOM:-0.25}
    ports:
      - "${TRAFFIC_PREDICTOR_PORT:-8022}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Prometheus supplies the measured capacity behind every recommendation.
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          # Lighter than the detector: no ML stack, and a forecast cycle is medians over ~670
          # hourly points per service.
          cpus: "0.50"
          memory: 384M

  # ---------------------------------------------------------------------------
  # Module 7 - RCA Engine.
  #
  # Correlates anomalies across temporal, topological, change, and event dimensions.
  # Produces ranked root cause hypotheses with evidence. Manages incident lifecycle
  # from detection to resolution. Publishes incidents with AI-generated summaries
  # to aiops.incidents stream.
  # ---------------------------------------------------------------------------
  rca-engine:
    <<: *aiops-common
    build:
      context: .
      dockerfile: services/rca_engine/Dockerfile
    image: aiops/rca-engine:0.1.0
    container_name: aiops-rca-engine
    environment:
      <<: *aiops-env
      AIOPS_SERVICE_NAME: rca-engine
      RCA_WINDOW_SECONDS: ${RCA_WINDOW_SECONDS:-300}
      RCA_AUTO_RESOLVE_SECONDS: ${RCA_AUTO_RESOLVE_SECONDS:-300}
    ports:
      - "${RCA_ENGINE_PORT:-8023}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # RCA engine consumes anomalies from the detector, so start after it
      anomaly-detector:
        condition: service_started
    deploy:
      resources:
        limits:
          # Correlation logic is computational but not heavy - mainly graph traversal
          # and time-series clustering. Lighter than the anomaly detector.
          cpus: "0.50"
          memory: 384M

  # ---------------------------------------------------------------------------
  # Module 6 - Healing Engine.
  #
  # Self-healing playbook engine. Consumes anomalies and incidents, selects remediation
  # playbooks based on anomaly kind and root cause hypotheses. Enforces four safety rails:
  # master switch (HEALING_ENABLED), per-target cooldown, hourly budget, min confidence.
  # Captures before/after metric snapshots and executes actions via Docker API.
  # ---------------------------------------------------------------------------
  healing-engine:
    <<: *aiops-common
    build:
      context: .
      dockerfile: services/healing_engine/Dockerfile
    image: aiops/healing-engine:0.1.0
    container_name: aiops-healing-engine
    user: root
    environment:
      <<: *aiops-env
      AIOPS_SERVICE_NAME: healing-engine
      HEALING_ENABLED: ${HEALING_ENABLED:-false}
      HEALING_MAX_ACTIONS_PER_HOUR: ${HEALING_MAX_ACTIONS_PER_HOUR:-10}
      HEALING_COOLDOWN_SECONDS: ${HEALING_COOLDOWN_SECONDS:-300}
      HEALING_MIN_CONFIDENCE: ${HEALING_MIN_CONFIDENCE:-0.7}
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "${HEALING_ENGINE_PORT:-8024}:8000"
    volumes:
      # Mount Docker socket so the engine can restart containers and scale services
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Healing consumes anomalies and incidents, so depends on both
      anomaly-detector:
        condition: service_started
      rca-engine:
        condition: service_started
    deploy:
      resources:
        limits:
          # Lightweight - mostly coordination and I/O. Docker operations are async.
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Module 8 - API Gateway.
  #
  # REST + WebSocket API that the dashboard queries. Reads from TimescaleDB (metrics,
  # anomalies, predictions, incidents, actions) and relays live events from Redis streams.
  # The dashboard connects to this, not directly to the backend modules.
  # ---------------------------------------------------------------------------
  api-gateway:
    <<: *aiops-common
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    image: aiops/api-gateway:0.1.0
    container_name: aiops-api-gateway
    environment:
      <<: *aiops-env
      AIOPS_SERVICE_NAME: api-gateway
      # CORS origin for the dashboard. In production this would be the dashboard's public URL.
      # For local dev, allow localhost on any port so both `npm run dev` (5173) and a
      # production build preview work without rebuilding the gateway.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4173}
      # Healing configuration - needed by /automation endpoint to report current status
      HEALING_ENABLED: ${HEALING_ENABLED:-false}
      HEALING_MAX_ACTIONS_PER_HOUR: ${HEALING_MAX_ACTIONS_PER_HOUR:-10}
      HEALING_COOLDOWN_SECONDS: ${HEALING_COOLDOWN_SECONDS:-300}
      HEALING_MIN_CONFIDENCE: ${HEALING_MIN_CONFIDENCE:-0.7}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The gateway queries what modules 3-7 write, so starting after them avoids returning
      # empty results while the pipeline is still initializing.
      metrics-agent:
        condition: service_started
      anomaly-detector:
        condition: service_started
      traffic-predictor:
        condition: service_started
      rca-engine:
        condition: service_started
      healing-engine:
        condition: service_started
    deploy:
      resources:
        limits:
          # Read-only queries and WebSocket relay; no heavy computation.
          cpus: "0.25"
          memory: 256M
