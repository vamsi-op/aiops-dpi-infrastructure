# Observability plane on Kubernetes: Prometheus, Grafana, Loki, Alloy, Tempo, Alertmanager.
#
# Config files are NOT duplicated here. scripts/k8s.ps1 builds ConfigMaps straight from the
# files Compose already uses (infra/loki, infra/tempo, infra/alertmanager, infra/grafana,
# infra/prometheus/rules), so the two substrates cannot drift. Only Prometheus scrape
# config and Alloy log discovery differ, and those live in deploy/k8s/config/.
#
# Storage is emptyDir: Prometheus, Loki and Tempo are short-horizon buffers on a local
# cluster. TimescaleDB holds the history the models train on, and that is persistent.

# ---------------------------------------------------------------------------
# Prometheus (with RBAC for Kubernetes service discovery)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: aiops
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: aiops
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: observability
    spec:
      # No legacy service-link env vars: the Service named \"redis\" would inject
      # REDIS_PORT=tcp://<ip>:6379 over the platform's own REDIS_PORT setting.
      enableServiceLinks: false
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
# ---------------------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------------------
# Local-cluster defaults, same as Compose: anonymous viewers, admin/admin.
# Never use these on a reachable cluster - `--public` overrides them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-env
  namespace: aiops
data:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: aiops
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: aiops
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: observability
    spec:
      # No legacy service-link env vars: the Service named \"redis\" would inject
      # REDIS_PORT=tcp://<ip>:6379 over the platform's own REDIS_PORT setting.
      enableServiceLinks: false
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          # Login settings come from envFrom so a public VM can override them: the
          # optional `grafana-public` Secret (created by `scripts/k8s.sh up --public`) is
          # listed last, and for duplicate keys the last envFrom source wins. Keeping them
          # out of `env` matters - `env` would beat both sources.
          envFrom:
            - configMapRef:
                name: grafana-env
            - secretRef:
                name: grafana-public
                optional: true
          env:
            - { name: GF_USERS_DEFAULT_THEME, value: dark }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/dpi-overview.json
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards }
      volumes:
        - name: data
          emptyDir: {}
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-providers
          configMap: { name: grafana-dashboard-providers }
---
# ---------------------------------------------------------------------------
# Loki
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: aiops
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: observability
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: aiops
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: observability
    spec:
      # No legacy service-link env vars: the Service named \"redis\" would inject
      # REDIS_PORT=tcp://<ip>:6379 over the platform's own REDIS_PORT setting.
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.0
          args: ["-config.file=/etc/loki/loki.yml"]
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
# ---------------------------------------------------------------------------
# Alloy - log shipping via the Kubernetes API
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs
  namespace: aiops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: aiops
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-logs
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: aiops
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: observability
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: http
      port: 12345
      targetPort: 12345
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: aiops
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: observability
spec:
  # Exactly one: two Alloys tailing the same pods through the API would ship every line twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: observability
    spec:
      # No legacy service-link env vars: the Service named \"redis\" would inject
      # REDIS_PORT=tcp://<ip>:6379 over the platform's own REDIS_PORT setting.
      enableServiceLinks: false
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12345
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data, mountPath: /var/lib/alloy/data }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: data
          emptyDir: {}
---
# ---------------------------------------------------------------------------
# Tempo - traces, plus the metrics generator that remote-writes the service graph
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: aiops
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: observability
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      nodePort: 30200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: aiops
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: observability
    spec:
      # No legacy service-link env vars: the Service named \"redis\" would inject
      # REDIS_PORT=tcp://<ip>:6379 over the platform's own REDIS_PORT setting.
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.10.0
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
            - containerPort: 4318
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
# ---------------------------------------------------------------------------
# Alertmanager
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: observability
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      nodePort: 30093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: observability
    spec:
      # No legacy service-link env vars: the Service named \"redis\" would inject
      # REDIS_PORT=tcp://<ip>:6379 over the platform's own REDIS_PORT setting.
      enableServiceLinks: false
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=http://localhost:9093
          ports:
            - containerPort: 9093
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
