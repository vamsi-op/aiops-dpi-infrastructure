# AIOps plane (modules 3-8) on Kubernetes - the twin of docker-compose.aiops.yml.
#
# Same images, same environment (ConfigMap aiops-env), same in-cluster DNS names.
# Two things are new compared with Compose:
#
# * The healing engine no longer mounts the Docker socket. It acts through the Kubernetes
#   API with its own ServiceAccount, bound to a namespaced Role that can patch Deployments,
#   delete pods and read ReplicaSets in `aiops` - and nothing else. Remediation has an
#   explicit, auditable blast radius instead of root on the Docker daemon.
# * The API gateway gets a narrower Role (read + patch Deployments) so the bad_deploy chaos
#   experiment can roll out a genuinely defective revision.
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-agent
  namespace: aiops
  labels:
    app.kubernetes.io/name: metrics-agent
    app.kubernetes.io/part-of: aiops
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: metrics-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-agent
  namespace: aiops
  labels:
    app.kubernetes.io/name: metrics-agent
    app.kubernetes.io/part-of: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-agent
        app.kubernetes.io/part-of: aiops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
      containers:
        - name: app
          image: aiops/metrics-agent:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aiops-env
            - secretRef:
                name: aiops-db
          env:
            - { name: AIOPS_SERVICE_NAME, value: "metrics-agent" }
            - { name: AIOPS_TOPOLOGY_FILE, value: "/etc/aiops/topology.json" }
            - { name: SCRAPE_INTERVAL_SECONDS, value: "15" }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
          volumeMounts:
            - name: topology
              mountPath: /etc/aiops
              readOnly: true
      volumes:
        - name: topology
          configMap:
            name: aiops-topology
---
# Trained Isolation Forests. Survive pod restarts so a restart does not force a retrain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anomaly-models
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-detector
  namespace: aiops
  labels:
    app.kubernetes.io/name: anomaly-detector
    app.kubernetes.io/part-of: aiops
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: anomaly-detector
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30021
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector
  namespace: aiops
  labels:
    app.kubernetes.io/name: anomaly-detector
    app.kubernetes.io/part-of: aiops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anomaly-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anomaly-detector
        app.kubernetes.io/part-of: aiops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        fsGroup: 10003
      containers:
        - name: app
          image: aiops/anomaly-detector:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aiops-env
            - secretRef:
                name: aiops-db
          env:
            - { name: AIOPS_SERVICE_NAME, value: "anomaly-detector" }
            - { name: MODEL_ARTIFACT_DIR, value: "/app/ml/artifacts" }
            - { name: ANOMALY_CONTAMINATION, value: "0.02" }
            - { name: ANOMALY_MIN_TRAINING_ROWS, value: "100" }
            - { name: ANOMALY_SCORE_THRESHOLD, value: "0.65" }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - name: models
              mountPath: /app/ml/artifacts
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: anomaly-models
---
