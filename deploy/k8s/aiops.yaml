---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healing-engine
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healing-engine
  namespace: aiops
rules:
  # restart (rolling restart) and rollback (rollout undo) patch the Deployment
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # rollback reads previous revisions
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # pod restart, health checks, global pod cap, unschedulable detection
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # pre-emptive scaling raises an HPA's floor when one owns the Deployment
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healing-engine
  namespace: aiops
subjects:
  - kind: ServiceAccount
    name: healing-engine
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healing-engine
---
apiVersion: v1
kind: Service
metadata:
  name: healing-engine
  namespace: aiops
  labels:
    app.kubernetes.io/name: healing-engine
    app.kubernetes.io/part-of: aiops
