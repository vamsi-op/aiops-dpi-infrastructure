# =============================================================================
# Workspace-level tooling configuration. This file is NOT a package definition —
# each service and library has its own pyproject / requirements file. It exists so
# ruff, mypy and pytest behave identically no matter which directory you run them in.
# =============================================================================

[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = ["dashboard", "ml/artifacts", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ASYNC",# async pitfalls
    "S",    # bandit security checks
    "DTZ",  # naive datetime usage
    "BLE",  # blind `except Exception` — allowed only with an explanatory noqa
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "S101",   # asserts are fine in tests
    "B008",   # FastAPI's Depends() in defaults is idiomatic
    "RUF001", # en dashes in prose strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"**/conftest.py" = ["S"]
# The simulator's entire purpose is generating pseudo-random traffic. S311 warns that
# `random` is unsuitable for cryptography, which is true and irrelevant here.
"services/mojaloop_sim/**" = ["S311"]
# The seeder uses `random` to shape synthetic traffic, not for anything security related,
# and imports after a sys.path insert so it can run as a plain script from the repo root.
"scripts/seed_demo_data.py" = ["S311", "E402", "S608"]
# Same three reasons: it drives the simulator's own traffic model, imports after a sys.path
# insert, and interpolates only the TABLE_METRICS constant into SQL.
"scripts/replay_history.py" = ["S311", "E402", "S608"]
# S608 (SQL built by string formatting) is a false positive in these two files: the only
# interpolated values are table-name constants from aiops_common.constants, and every
# runtime value is a bound parameter. Verified by review, not assumed — if you add a
# query here, the same must remain true.
"services/api_gateway/api_gateway/repository.py" = ["S608"]
# Same exemption, same reasoning, same obligation: the only interpolated value is
# TABLE_METRICS from aiops_common.constants, and every runtime value is a bound parameter.
"services/metrics_agent/metrics_agent/writer.py" = ["S608"]
"scripts/check_metrics_agent.py" = ["S608"]
# Same again: only TABLE_* constants from aiops_common.constants are interpolated.
"services/anomaly_detector/anomaly_detector/trainer.py" = ["S608"]
"services/anomaly_detector/anomaly_detector/detector.py" = ["S608"]
"scripts/check_anomaly_detector.py" = ["S608"]
"services/traffic_predictor/traffic_predictor/predictor.py" = ["S608"]
"scripts/check_traffic_predictor.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = [
    "aiops_common",
    "anomaly_detector",
    "api_gateway",
    "healing_engine",
    "metrics_agent",
    "mojaloop_sim",
    "rca_engine",
    "traffic_predictor",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", "\\.venv/", "dashboard/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party packages without bundled type hints.
module = ["sklearn.*", "statsmodels.*", "docker.*", "kubernetes.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy ships its own stubs, and from 2.x they use `type` statement syntax that mypy only
# accepts under python_version >= 3.12. Following them fails to parse and aborts the whole
# run before any of our code is checked.
#
# Skipped rather than bumping `python_version` to 3.12, because that setting is a real promise:
# aiops_common declares `requires-python = ">=3.11"` and the shared library genuinely does run
# there. Our own use of numpy is a handful of array operations whose types we do not need
# checked; what matters is that the code around them is.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "libs", "services"]
# Each service is a self-contained app rather than an installed package, so its root goes
# on the path here. Doing it once centrally beats a sys.path hack repeated in every test
# module, which is what this replaced.
pythonpath = [
    "libs/aiops_common/src",
    "services/anomaly_detector",
    "services/api_gateway",
    "services/healing_engine",
    "services/metrics_agent",
    "services/mojaloop_sim",
    "services/rca_engine",
    "services/traffic_predictor",
]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the docker compose stack running",
    "slow: takes more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:aiops_common.*"]

[tool.coverage.run]
source = ["libs", "services"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
